<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wayword Alpha Pulse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="/assets/icons/favicon.ico?v=6" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg?v=6" />
  <link rel="stylesheet" href="/alpha-pulse/alpha-pulse-dashboard.css?v=20260610-alpha-pulse-1" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("wayword-theme") || "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (_) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body>
  <main class="alpha-pulse-shell">
    <section class="alpha-pulse-hero">
      <p class="alpha-pulse-kicker">Wayword</p>
      <h1>Telemetry</h1>
      <p class="alpha-pulse-intro">Usage across the writing flow.</p>
      <div id="alphaPulseStatus" class="alpha-pulse-status" aria-live="polite">Loading Alpha Pulse...</div>
    </section>

    <section class="alpha-pulse-panel">
      <div class="alpha-pulse-panel__head">
        <div>
          <h2>Funnel</h2>
          <p id="alphaPulseWindowLabel" class="alpha-pulse-meta"></p>
        </div>
        <div class="alpha-pulse-panel__controls">
          <div id="alphaPulseRangeControls" class="alpha-pulse-range-controls" role="group" aria-label="Timeframe">
            <button type="button" class="alpha-pulse-range-btn" data-range="7">7d</button>
            <button type="button" class="alpha-pulse-range-btn" data-range="14">14d</button>
            <button type="button" class="alpha-pulse-range-btn" data-range="30">30d</button>
            <button type="button" class="alpha-pulse-range-btn" data-range="all">All</button>
          </div>
          <button type="button" id="alphaPulseRefreshButton" class="alpha-pulse-refresh-btn">Refresh now</button>
          <div id="alphaPulseSourceSummary" class="alpha-pulse-source-summary"></div>
        </div>
      </div>
      <div id="alphaPulseFunnel" class="alpha-pulse-funnel" aria-live="polite"></div>
    </section>

    <section class="alpha-pulse-panel">
      <div class="alpha-pulse-panel__head">
        <div>
          <h2>Source</h2>
          <p class="alpha-pulse-meta">Aggregate event counts only.</p>
        </div>
      </div>
      <ul id="alphaPulseSeams" class="alpha-pulse-seams"></ul>
    </section>
  </main>

  <script src="/env.runtime.js"></script>
  <script src="/src/config/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/src/infrastructure/auth/supabase-client.js"></script>
  <script src="/src/infrastructure/auth/auth-session-runtime.js"></script>
  <script src="/src/infrastructure/telemetry/event-registry.js"></script>
  <script src="/src/infrastructure/telemetry/retention-events.js"></script>
  <script src="/src/alpha-pulse/alpha-pulse-dashboard.js?v=20260610-alpha-pulse-1"></script>
</body>
</html>
