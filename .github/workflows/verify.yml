name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies without browser download
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Run merge verification
        run: npm run verify:merge

  chromium-smoke:
    name: Chromium smoke
    needs: merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies without browser download
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Chromium smoke coverage
        run: npm run test:smoke:chromium
